<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Preview only: this page cannot load outside images, so each Unsplash photo
      // is swapped for a matching drawing here. Students' copies load the real photos.
      (function () {
        const svg = (bg, shapes) =>
          "data:image/svg+xml," +
          encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110"><rect width="160" height="110" fill="${bg}"/>${shapes}</svg>`,
          );

        const pictures = {
          "1562217199-6e6d4cd031f5": svg(
            "#ede9fe",
            `
    <rect x="52" y="16" width="58" height="80" rx="6" fill="#7c3aed"/>
    <rect x="66" y="32" width="32" height="12" rx="2" fill="#fff"/>
    <rect x="66" y="52" width="32" height="3" rx="1.5" fill="#c4b5fd"/>
    <rect x="66" y="60" width="24" height="3" rx="1.5" fill="#c4b5fd"/>
    ${[24, 36, 48, 60, 72, 84].map((y) => `<circle cx="52" cy="${y}" r="4" fill="#fff" stroke="#4c1d95" stroke-width="2"/>`).join("")}`,
          ),

          "1567855354833-ac2c4f967b0c": svg(
            "#ffedd5",
            ["#2563eb", "#dc2626", "#111827", "#16a34a", "#7c3aed"]
              .map(
                (c, i) => `
    <rect x="${50 + i * 13}" y="18" width="9" height="62" rx="3" fill="${c}"/>
    <rect x="${50 + i * 13}" y="18" width="9" height="12" rx="3" fill="#fff" opacity=".35"/>
    <path d="M${50 + i * 13} 80 h9 l-4.5 14 z" fill="#e5e7eb"/>`,
              )
              .join(""),
          ),

          "1544003484-3cd181d17917": svg(
            "#dcfce7",
            `
    <rect x="61" y="14" width="38" height="10" rx="4" fill="#1f2937"/>
    <path d="M58 26 H102 L96 94 Q80 100 64 94 Z" fill="#22a06b"/>
    <rect x="60" y="48" width="40" height="12" fill="#fff" opacity=".85"/>
    <path d="M66 30 L70 90" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".35"/>`,
          ),

          "1581068466660-e6585b8afa97": svg(
            "#e0e7ff",
            `
    <rect x="34" y="40" width="70" height="32" rx="9" fill="#6366f1"/>
    <circle cx="46" cy="56" r="5" fill="#e0e7ff"/>
    <rect x="104" y="45" width="24" height="22" rx="2" fill="#cbd5e1"/>
    <rect x="112" y="50" width="6" height="5" fill="#64748b"/>
    <rect x="112" y="58" width="6" height="5" fill="#64748b"/>
    <text x="76" y="61" font-family="Arial" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">32GB</text>`,
          ),

          "1683739147682-607fb8e24e3f": svg(
            "#fef9c3",
            `
    <rect x="40" y="30" width="46" height="46" rx="3" fill="#f472b6" transform="rotate(-8 63 53)"/>
    <rect x="62" y="26" width="46" height="46" rx="3" fill="#facc15" transform="rotate(6 85 49)"/>
    <rect x="76" y="44" width="46" height="46" rx="3" fill="#60a5fa" transform="rotate(-3 99 67)"/>
    <rect x="84" y="56" width="28" height="3" rx="1.5" fill="#1e3a8a" opacity=".4"/>
    <rect x="84" y="64" width="20" height="3" rx="1.5" fill="#1e3a8a" opacity=".4"/>`,
          ),

          "1555679792-6783ef0bbf61": svg(
            "#e2e8f0",
            `
    <path d="M56 36 Q58 70 80 78 Q102 70 104 36" fill="none" stroke="#334155" stroke-width="3"/>
    <path d="M80 78 V96" stroke="#334155" stroke-width="3"/>
    <rect x="76" y="94" width="8" height="10" rx="2" fill="#94a3b8"/>
    <circle cx="56" cy="30" r="11" fill="#334155"/>
    <circle cx="104" cy="30" r="11" fill="#334155"/>
    <circle cx="53" cy="27" r="3" fill="#fff" opacity=".5"/>
    <circle cx="101" cy="27" r="3" fill="#fff" opacity=".5"/>`,
          ),
          "1511377107391-116a9d5d20b5": svg(
            "#f3e8ff",
            `
    <rect x="54" y="10" width="52" height="90" rx="7" fill="#1e1b4b"/>
    <rect x="61" y="18" width="38" height="16" rx="2" fill="#a7f3d0"/>
    ${[0, 1, 2, 3]
      .map((r) =>
        [0, 1, 2]
          .map(
            (c) =>
              `<rect x="${62 + c * 13}" y="${42 + r * 13}" width="10" height="9" rx="2" fill="${c === 2 && r === 3 ? "#f97316" : "#c7d2fe"}"/>`,
          )
          .join(""),
      )
      .join("")}`,
          ),

          "1587133454235-762b65c9f5c0": svg(
            "#ccfbf1",
            `
    <rect x="44" y="24" width="72" height="62" rx="12" fill="#0f766e"/>
    <rect x="52" y="32" width="56" height="46" rx="8" fill="#14b8a6" opacity=".35"/>
    ${[0, 1, 2, 3].map((i) => `<circle cx="${68 + i * 8}" cy="74" r="2.5" fill="${i < 3 ? "#a7f3d0" : "#134e4a"}"/>`).join("")}
    <rect x="70" y="86" width="20" height="5" rx="2" fill="#134e4a"/>
    <path d="M82 40 L72 56 H80 L76 68 L88 50 H80 Z" fill="#fff"/>`,
          ),

          "1547954569-06aabe3b39b1": svg(
            "#fef3c7",
            `
    <path d="M60 28 Q80 10 100 28 L120 42 L112 64 L104 60 V98 H56 V60 L48 64 L40 42 Z" fill="#7c3aed"/>
    <path d="M66 28 Q80 44 94 28 Q80 18 66 28 Z" fill="#4c1d95"/>
    <path d="M76 38 V54 M84 38 V54" stroke="#fde68a" stroke-width="2"/>
    <path d="M64 76 H96 V90 H64 Z" fill="#6d28d9"/>`,
          ),
        };

        document.addEventListener(
          "error",
          function (e) {
            var img = e.target;
            if (!img || img.tagName !== "IMG" || img.dataset.fallback) return;
            var key = Object.keys(pictures).find(function (k) {
              return img.src.indexOf(k) !== -1;
            });
            img.dataset.fallback = "1";
            if (key) img.src = pictures[key];
          },
          true,
        );
      })();
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap");

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Poppins", system-ui, sans-serif;
        background: #f8f6fd;
        color: #1f1535;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 20px;
        background: #2e1a52;
        color: #ffffff;
      }
      .topbar h1 {
        margin: 0;
        font-size: 20px;
      }

      .cart-badge {
        font-weight: 600;
      }
      .badge {
        display: inline-block;
        min-width: 26px;
        padding: 2px 8px;
        margin-left: 4px;
        border-radius: 999px;
        background: #ff7a1a;
        color: #1b0d00;
        text-align: center;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 20px;
        padding: 20px;
      }
      @media (max-width: 640px) {
        .layout {
          grid-template-columns: 1fr;
          padding: 14px;
        }
      }

      h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 12px;
      }

      .product {
        padding: 12px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(46, 16, 101, 0.08);
      }
      .thumb {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 11;
        object-fit: cover;
        border-radius: 8px;
        background: #f3f0fb;
      }
      .mini {
        width: 40px;
        height: 28px;
        object-fit: cover;
        border-radius: 5px;
      }
      .cart-items .name {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .product h3 {
        margin: 10px 0 2px;
        font-size: 15px;
      }
      .price {
        margin: 0 0 10px;
        color: #6d28d9;
        font-weight: 700;
      }

      button {
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        border: 0;
        border-radius: 8px;
      }
      .add-btn {
        width: 100%;
        padding: 9px;
        background: #6d28d9;
        color: #ffffff;
      }
      .add-btn:hover {
        background: #5b21b6;
      }
      .add-btn.added {
        background: #1d8a4e;
      }

      .cart {
        align-self: start;
        padding: 16px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(46, 16, 101, 0.08);
      }
      .empty {
        color: #6f6787;
      }

      .cart-items {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .cart-items li {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: 8px;
        padding: 10px 0;
        border-bottom: 1px solid #ece8f6;
        font-size: 14px;
      }
      .cart-items .name {
        grid-column: 1 / -1;
        font-weight: 600;
      }
      .qty {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .qty button {
        width: 30px;
        height: 30px;
        background: #ede9fe;
        color: #1f1535;
      }
      .line-total {
        font-weight: 700;
      }
      .remove {
        padding: 4px 8px;
        background: transparent;
        color: #d13b2a;
      }

      .total {
        display: flex;
        justify-content: space-between;
        margin: 14px 0;
        font-size: 18px;
      }
      .secondary {
        width: 100%;
        padding: 9px;
        background: #ede9fe;
        color: #1f1535;
      }
      .secondary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <h1>Campus Shop</h1>
      <div class="cart-badge">
        Cart <span id="cartCount" class="badge">0</span>
      </div>
    </header>

    <main class="layout">
      <section>
        <h2>Products</h2>
        <div id="productList" class="grid"></div>
      </section>

      <aside class="cart">
        <h2>Your cart</h2>
        <p id="emptyMsg" class="empty">Your cart is empty.</p>
        <ul id="cartItems" class="cart-items"></ul>
        <div class="total">
          <span>Total</span>
          <strong id="cartTotal">₱0.00</strong>
        </div>
        <button id="clearCart" class="secondary">Clear cart</button>
      </aside>
    </main>
    <script>
      // LEVEL 3: Adding to cart

      // PRODUCT PHOTOS
      // For this demo, we just used unsplash but ofcourse you can use your own images.
      // The "photo" function below builds a URL for each photo, and the "pictures" object stores them in a way that makes it easy to assign to each product. You can replace the Unsplash URLs with your own image paths if you like.
      // You can save yours in an "images" folder and write
      // image: 'images/notebook.jpg' in the products list instead.
      const photo = (id) =>
        `https://images.unsplash.com/${id}?w=400&h=275&fit=crop&auto=format&q=70`;

      const pictures = {
        notebook: photo("photo-1562217199-6e6d4cd031f5"),
        pens: photo("photo-1567855354833-ac2c4f967b0c"),
        tumbler: photo("photo-1544003484-3cd181d17917"),
        usb: photo("photo-1581068466660-e6585b8afa97"),
        notes: photo("photo-1683739147682-607fb8e24e3f"),
        earphones: photo("photo-1555679792-6783ef0bbf61"),
      };

      // 1. DATA: products live in an array of objects
      const products = [
        { id: 1, name: "Spiral Notebook", price: 45, image: pictures.notebook },
        { id: 2, name: "Ballpen Set (5)", price: 60, image: pictures.pens },
        { id: 3, name: "Tumbler 500ml", price: 299, image: pictures.tumbler },
        {
          id: 4,
          name: "USB Flash Drive 32GB",
          price: 250,
          image: pictures.usb,
        },
        { id: 5, name: "Sticky Notes Pack", price: 85, image: pictures.notes },
        {
          id: 6,
          name: "Wired Earphones",
          price: 199,
          image: pictures.earphones,
        },
      ];

      // The cart only stores the product id and quantity
      let cart = []; // e.g. [{ id: 3, qty: 2 }]

      // 2. ELEMENTS
      const productList = document.querySelector("#productList");
      const cartItems = document.querySelector("#cartItems");
      const cartCount = document.querySelector("#cartCount");
      const cartTotal = document.querySelector("#cartTotal");
      const emptyMsg = document.querySelector("#emptyMsg");
      const clearBtn = document.querySelector("#clearCart");

      // 3. HELPERS
      const peso = (amount) =>
        "₱" +
        amount.toLocaleString("en-PH", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });

      const findProduct = (id) => products.find((p) => p.id === id);

      // 4. SHOW THE PRODUCTS (map turns each object into HTML)
      function renderProducts() {
        productList.innerHTML = products
          .map(
            (p) => `
    <div class="product">
      <img class="thumb" src="${p.image}" alt="${p.name}">
      <h3>${p.name}</h3>
      <p class="price">${peso(p.price)}</p>
      <button class="add-btn" data-id="${p.id}">Add to cart</button>
    </div>
  `,
          )
          .join("");
      }

      // 5. CART ACTIONS
      function addToCart(id) {
        const item = cart.find((i) => i.id === id);
        if (item) {
          item.qty++; // already in cart: add one more
        } else {
          cart.push({ id, qty: 1 }); // new item
        }
        renderCart();
      }

      function changeQty(id, amount) {
        const item = cart.find((i) => i.id === id);
        item.qty += amount;
        if (item.qty <= 0) removeItem(id);
        else renderCart();
      }

      function removeItem(id) {
        cart = cart.filter((i) => i.id !== id);
        renderCart();
      }

      // 6. DRAW THE CART (called after EVERY change)
      function renderCart() {
        cartItems.innerHTML = cart
          .map((item) => {
            const p = findProduct(item.id);
            return `
      <li>
        <span class="name"><img class="mini" src="${p.image}" alt="">${p.name}</span>
        <div class="qty">
          <button data-action="minus" data-id="${p.id}" aria-label="Remove one">−</button>
          <span>${item.qty}</span>
          <button data-action="plus" data-id="${p.id}" aria-label="Add one">+</button>
        </div>
        <span class="line-total">${peso(p.price * item.qty)}</span>
        <button class="remove" data-action="remove" data-id="${p.id}" aria-label="Remove ${p.name}">✕</button>
      </li>`;
          })
          .join("");

        // reduce() adds everything up
        const totalQty = cart.reduce((sum, i) => sum + i.qty, 0);
        const total = cart.reduce(
          (sum, i) => sum + findProduct(i.id).price * i.qty,
          0,
        );

        cartCount.textContent = totalQty;
        cartTotal.textContent = peso(total);
        emptyMsg.hidden = cart.length > 0;
        clearBtn.disabled = cart.length === 0;
      }

      // 7. EVENTS
      productList.addEventListener("click", (event) => {
        const btn = event.target.closest(".add-btn");
        if (!btn) return;

        addToCart(Number(btn.dataset.id));

        // quick feedback on the button
        btn.textContent = "Added ✓";
        btn.classList.add("added");
        setTimeout(() => {
          btn.textContent = "Add to cart";
          btn.classList.remove("added");
        }, 800);
      });

      cartItems.addEventListener("click", (event) => {
        const btn = event.target.closest("button");
        if (!btn) return;

        const id = Number(btn.dataset.id);
        if (btn.dataset.action === "plus") changeQty(id, 1);
        if (btn.dataset.action === "minus") changeQty(id, -1);
        if (btn.dataset.action === "remove") removeItem(id);
      });

      clearBtn.addEventListener("click", () => {
        cart = [];
        renderCart();
      });

      // 8. START
      renderProducts();
      renderCart();
    </script>
  </body>
</html>
