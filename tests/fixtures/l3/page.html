<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level 3 - Add to Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Campus Shop</h1>
    <div class="cart-badge">Cart <span id="cartCount" class="badge">0</span></div>
  </header>

  <main class="layout">
    <section>
      <h2>Products</h2>
      <div id="productList" class="grid"></div>
    </section>

    <aside class="cart">
      <h2>Your cart</h2>
      <p id="emptyMsg" class="empty">Your cart is empty.</p>
      <ul id="cartItems" class="cart-items"></ul>
      <div class="total">
        <span>Total</span>
        <strong id="cartTotal">₱0.00</strong>
      </div>
      <button id="clearCart" class="secondary">Clear cart</button>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
