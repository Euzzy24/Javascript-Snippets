<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level 1 - Button Clicks</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px;
      font-family: system-ui, "Segoe UI", Arial, sans-serif;
      background: #f1f7f5;
      color: #10223a;
      transition: background 0.3s, color 0.3s;
    }

    /* Dark mode: JavaScript adds the "dark" class to <body> */
    body.dark { background: #0d1715; color: #e6eef7; }

    .card {
      max-width: 440px;
      margin: 0 auto;
      padding: 28px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(16, 34, 58, 0.12);
    }
    body.dark .card { background: #13201d; }

    h1 { margin: 0 0 8px; font-size: 26px; }

    .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 24px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }

    button {
      padding: 10px 16px;
      font: inherit;
      font-weight: 600;
      border: 0;
      border-radius: 10px;
      background: #0f7b6c;
      color: #ffffff;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    button:hover { background: #0b5f54; }
    button:active { transform: scale(0.95); }
    button.secondary { background: #dcece7; color: #10223a; }
    body.dark button.secondary { background: #1f3a35; color: #e6eef7; }

    label { font-weight: 600; font-size: 14px; }

    input {
      flex: 1 1 180px;
      min-width: 0;
      padding: 10px 12px;
      font: inherit;
      border: 2px solid #cfe0db;
      border-radius: 10px;
    }
    input:focus { outline: none; border-color: #0f7b6c; }

    .message { min-height: 1.5em; font-weight: 600; color: #1d8a4e; }
    .message.error { color: #d13b2a; }

    /* Small bounce when the number changes */
    #count { display: inline-block; }
    .bump { animation: bump 0.25s ease; }
    @keyframes bump { 50% { transform: scale(1.4); } }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="greeting">Hello, student!</h1>
    <p>You clicked <strong id="count">0</strong> times.</p>

    <div class="buttons">
      <button id="clickBtn">Click me</button>
      <button id="resetBtn" class="secondary">Reset</button>
      <button id="themeBtn" class="secondary">Dark mode</button>
    </div>

    <label for="nameInput">What is your name?</label>
    <div class="row">
      <input id="nameInput" type="text" placeholder="Type your name">
      <button id="greetBtn">Greet me</button>
    </div>
    <p id="message" class="message"></p>
  </main>

  <script>
    // LEVEL 1: Click a button and do something

    // 1. Select the elements we will use
    const countEl   = document.querySelector('#count');
    const clickBtn  = document.querySelector('#clickBtn');
    const resetBtn  = document.querySelector('#resetBtn');
    const themeBtn  = document.querySelector('#themeBtn');
    const nameInput = document.querySelector('#nameInput');
    const greetBtn  = document.querySelector('#greetBtn');
    const greeting  = document.querySelector('#greeting');
    const message   = document.querySelector('#message');

    // 2. A variable that remembers how many clicks
    let count = 0;

    // 3. Show the number on the screen, with a small bounce
    function showCount() {
      countEl.textContent = count;
      countEl.classList.remove('bump');
      void countEl.offsetWidth; // trick to restart the animation
      countEl.classList.add('bump');
    }

    // 4. Listen for clicks
    clickBtn.addEventListener('click', () => {
      count++;
      showCount();
      if (count === 10) {
        showMessage('Ten clicks! You are on fire.');
      }
    });

    resetBtn.addEventListener('click', () => {
      count = 0;
      showCount();
      showMessage('Counter reset.');
    });

    themeBtn.addEventListener('click', () => {
      // toggle() adds the class if missing, removes it if present
      const isDark = document.body.classList.toggle('dark');
      themeBtn.textContent = isDark ? 'Light mode' : 'Dark mode';
    });

    // 5. Read what the user typed
    function greet() {
      const name = nameInput.value.trim();

      if (name === '') {
        showMessage('Please type your name first.', true);
        nameInput.focus();
        return; // stop here
      }

      greeting.textContent = `Hello, ${name}!`;
      showMessage(`Nice to meet you, ${name}.`);
      nameInput.value = '';
    }

    greetBtn.addEventListener('click', greet);

    nameInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') greet();
    });

    // 6. One helper for messages (green = OK, red = error)
    function showMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle('error', isError);
    }
  </script>
</body>
</html>
