<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level 1 - Button Clicks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1 id="greeting">Hello, student!</h1>
    <p>You clicked <strong id="count">0</strong> times.</p>

    <div class="buttons">
      <button id="clickBtn">Click me</button>
      <button id="resetBtn" class="secondary">Reset</button>
      <button id="themeBtn" class="secondary">Dark mode</button>
    </div>

    <label for="nameInput">What is your name?</label>
    <div class="row">
      <input id="nameInput" type="text" placeholder="Type your name">
      <button id="greetBtn">Greet me</button>
    </div>
    <p id="message" class="message"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
